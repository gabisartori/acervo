# Control input devices such as keyboards and Mice

# Allows for adding custom layouts to XKB, this isn't being currently used
env = XKB_CONFIG_ROOT,~/.config/xkb

input {
  kb_layout = br
  kb_variant = abnt2
  kb_model =
  kb_options =
  kb_rules =

  follow_mouse = 1

  touchpad {
    natural_scroll = yes
    scroll_factor = 0.5
  }

  sensitivity = 0.3 # -1.0 - 1.0, 0 means no modification.
}

